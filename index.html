<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HATIM · 12-Week Lean Phase</title>
<meta name="description" content="Lean-out program and performance playbook: training, nutrition, pumps, hormones, energy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#121212;--line:#232323;--ink:#f2f2ee;--mute:#8d8d86;--acc:#c6ff3d;--hot:#ff4d2e}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:16px/1.6 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.hd,h1,h2{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:.98}
.mono{font-family:"JetBrains Mono",monospace;font-weight:500}
section{padding:84px 0 10px;scroll-margin-top:56px}
h2{font-size:clamp(40px,7vw,76px);margin-bottom:12px}
h2 em{font-style:normal;color:var(--acc)}
.tag{font:500 12px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.lead{color:var(--mute);max-width:640px;margin-bottom:34px;font-size:17px}
.mute{color:var(--mute)}.small{font-size:13.5px}

nav{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:18px;height:52px}
nav b{font-family:Anton;letter-spacing:.06em;color:var(--acc)}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.links::-webkit-scrollbar{display:none}
.links a{padding:6px 11px;font-size:13px;color:var(--mute);text-decoration:none;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.links a:hover,.links a.on{color:var(--bg);background:var(--acc)}

.hero{padding:70px 0 20px}
.hero h1{font-size:clamp(64px,15vw,190px);margin:6px 0 18px}
.hero h1 span{color:var(--acc)}
.hero p{font-size:19px;color:var(--mute);max-width:600px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:42px}
.stats div{background:var(--bg);padding:20px}
.stats b{display:block;font:400 38px Anton;color:var(--ink)}.stats span{font-size:13px;color:var(--mute)}

.read{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.read>div{background:var(--card);padding:24px}
.read h3{font:400 24px Anton;text-transform:uppercase;margin-bottom:8px}
ul.l{list-style:none}
ul.l li{padding:8px 0 8px 22px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
ul.l li:last-child{border:0}
ul.l li::before{content:"→";position:absolute;left:0;color:var(--acc)}

.macros{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.mc{background:var(--card);border:1px solid var(--line);padding:18px}
.mc b{display:block;font:400 34px Anton;color:var(--acc)}.mc span{font-size:12.5px;color:var(--mute)}
.table{width:100%;border-collapse:collapse;font-size:14.5px}
.table td,.table th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.table th{font:500 12px "JetBrains Mono";color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.table td:first-child{white-space:nowrap;color:var(--acc);font-family:"JetBrains Mono";font-size:13px}
.box{background:var(--card);border:1px solid var(--line);padding:24px;margin-top:18px}
.box h3{font:400 24px Anton;text-transform:uppercase;margin-bottom:8px}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tab{padding:9px 16px;border:1px solid var(--line);font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--mute)}
.tab.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.panel{background:var(--card);border:1px solid var(--line);padding:26px}
.panel h3{font:400 34px Anton;text-transform:uppercase;margin-bottom:2px}
.panel>p{color:var(--mute);margin-bottom:14px;font-size:14.5px}
.ex{display:grid;grid-template-columns:30px 1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ex i{font:500 13px "JetBrains Mono";color:var(--mute);font-style:normal;padding-top:2px}
.ex b{font-weight:600}.ex span{font:500 13px "JetBrains Mono";color:var(--acc);text-align:right}.ex em{grid-column:2/-1;font-style:normal;color:var(--mute);font-size:13.5px}

.tips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tip{background:var(--card);border:1px solid var(--line);padding:20px}
.tip h4{font-size:16px;margin-bottom:6px}.tip h4 b{color:var(--acc);font-family:"JetBrains Mono";font-size:12px;margin-right:8px}
.tip p{color:var(--mute);font-size:14.5px;margin:0}
.rule{border-left:4px solid var(--hot);background:#1a0f0d;padding:18px 22px;margin:20px 0}
.rule b{color:var(--hot)}
.tier{display:grid;grid-template-columns:70px 1fr;gap:4px 16px;padding:14px 0;border-top:1px solid var(--line)}
.tier>b{font:400 30px Anton;color:var(--acc)}
.tier.c>b{color:var(--hot)}
footer{margin-top:90px;padding:40px 0 70px;border-top:1px solid var(--line);color:var(--mute);font-size:13.5px}
footer b{display:block;font:400 40px Anton;color:var(--ink);text-transform:uppercase;margin-bottom:6px}

@media(max-width:820px){
  .stats,.read,.tips{grid-template-columns:1fr 1fr}
  .read,.tips{grid-template-columns:1fr}
  .macros{grid-template-columns:repeat(2,1fr)}
  nav b{display:none}
  .table{font-size:13.5px}
}
</style>
</head>
<body>

<nav><div class="wrap"><b>HATIM</b><div class="links" id="links"></div></div></nav>

<header class="hero"><div class="wrap">

  <div class="stats">
    <div><b>180 cm</b><span>height</span></div><div><b>75 kg</b><span>start weight</span></div>
    <div><b>~2,500</b><span>kcal / day</span></div><div><b>4 days</b><span>lifting / week</span></div>
  </div>
</div></header>

<div id="app"></div>

 {d:'Mon',t:'Upper A',s:'Strength focus · chest, back, shoulders, arms · 75 min',x:[

 +sec('pump','04 · Gym pumps','Pump <em>protocol.</em>','The routine to walk in already pumped and make every session count.',
 `<table class="table"><tr><th>Step</th><th>Do this</th></tr>${PUMP.map(e=>`<tr><td>${e[0]}</td><td>${e[1]}</td></tr>`).join('')}</table>`)
 +sec('hacks','05 · Hacks','The <em>edge.</em>','Everything below works. No myths, no snake oil. Pick a tab.',
 `<div class="tabs">${Object.keys(HACKS).map(k=>`<button class="tab ${k===hk?'on':''}" data-h="${k}">${k}</button>`).join('')}</div><div class="tips" id="tips"></div>`)
 +sec('supps','06 · Supplements','Tier <em>list.</em>','Food and sleep first. These are the add-ons, ranked by evidence.',
 SUPPS.map(s=>`<div class="tier ${s[0]==='C'?'c':''}"><b>${s[0]}</b><div><b>${s[1]}</b><br><span class="mute small">${s[2]}</span></div></div>`).join(''))
 +sec('rules','07 · Rules','Don\'t <em>break these.</em>','',
 RULES.map(r=>`<div class="rule">${r}</div>`).join(''))
 +`<footer><div class="wrap"><b>Now go lift.</b>General fitness guidance, not medical advice. If you have a health condition or take medication, check with a doctor.</div></footer>`;
 $$('[data-d]').forEach(b=>b.onclick=()=>{dayIdx=+b.dataset.d;$$('[data-d]').forEach(x=>x.classList.toggle('on',x===b));renderDay()});
 $$('[data-h]').forEach(b=>b.onclick=()=>{hk=b.dataset.h;$$('[data-h]').forEach(x=>x.classList.toggle('on',x===b));renderTips()});
 renderDay();renderTips();spy();
}
function renderDay(){const d=DAYS[dayIdx];
 $('#day').innerHTML=`<h3>${d.t}</h3><p>${d.s}</p>`+d.x.map((x,i)=>`<div class="ex"><i>${String(i+1).padStart(2,'0')}</i><b>${x[0]}</b><span>${x[1]}</span><em>${x[2]}</em></div>`).join('')}
function renderTips(){$('#tips').innerHTML=HACKS[hk].map((t,i)=>`<div class="tip"><h4><b>${String(i+1).padStart(2,'0')}</b>${t[0]}</h4><p>${t[1]}</p></div>`).join('')}
function spy(){const y=scrollY+120;let cur='';NAV.forEach(n=>{const e=document.getElementById(n[0]);if(e&&e.offsetTop<=y)cur=n[0]});$$('#links a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+cur))}
addEventListener('scroll',spy,{passive:true});
render();
</script>
</body>
</html>
